<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phishing Email Detector{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <a class="brand" href="{{ url_for('main.index') }}">Phishing Email Detector</a>
      <nav>
        <a href="{{ url_for('main.index') }}">Analyze</a>
        <a href="{{ url_for('main.history') }}">History</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="notice ok" role="status">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    Advisory tool for learning. Use synthetic emails only. Never click links in suspicious emails.
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
